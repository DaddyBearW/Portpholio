<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио студента</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <!-- Шапка сайта -->
        <header class="header">
            <div class="logo-section">
                <div class="logo">⭐DaddyBear⭐</div>
                <div class="student-name">Мосенц Михаил</div>
            </div>
            <nav class="navigation">
                <a href="index.html" class="nav-link active">[Главная]</a>
                <a href="pages/projects.html" class="nav-link">[Проекты]</a>
                <a href="pages/diary.html" class="nav-link">[Дневник]</a>
                <a href="pages/contacts.html" class="nav-link">[Контакты]</a>
            </nav>
        </header>

        <!-- Основное содержимое -->
        <main class="main-content">
            <!-- Блок приветствия -->
            <section class="welcome-section">
                <div class="photo-container">
                    <img src="../images/Me.png" alt="Фото студента" class="photo">
                </div>
                <div class="welcome-text">
                    <h1>Привет! Я студент</h1>
                    <p>группы ЭФБО-13-24</p>
                    <p>Увлекаюсь веб-разработкой</p>
                    <!-- ССЫЛКА НА РЕЗЮМЕ В ПАПКЕ assets -->
                    <a href="assets/resume.pdf" download class="resume-btn">[Скачать резюме]</a>
                </div>
            </section>


            <!-- Блок навыков -->
            <section class="skills-section">
                <h2>Мои навыки</h2>
                <div class="skill">
                    <span class="skill-name">HTML/CSS</span>
                    <div class="skill-bar">
                        <div class="skill-level" style="width: 90%;"></div>
                    </div>
                    <span class="skill-percent">90%</span>
                </div>
                <div class="skill">
                    <span class="skill-name">JavaScript</span>
                    <div class="skill-bar">
                        <div class="skill-level" style="width: 80%;"></div>
                    </div>
                    <span class="skill-percent">80%</span>
                </div>
                <div class="skill">
                    <span class="skill-name">Bootstrap</span>
                    <div class="skill-bar">
                        <div class="skill-level" style="width: 85%;"></div>
                    </div>
                    <span class="skill-percent">85%</span>
                </div>
                <div class="skill">
                    <span class="skill-name">React</span>
                    <div class="skill-bar">
                        <div class="skill-level" style="width: 60%;"></div>
                    </div>
                    <span class="skill-percent">60%</span>
                </div>
            </section>

            <!-- Блок проектов -->
            <section class="projects-section">
                <h2>Лучшие проекты</h2>
                <div class="projects-grid">
                    <div class="project">
                        <img src="images/project1.png" alt="Проект 1">
                    </div>
                    <div class="project">
                        <img src="images/project2.png" alt="Проект 2">
                    </div>
                    <div class="project">
                        <img src="images/project3.png" alt="Проект 3">
                    </div>
                </div>
            </section>
        </main>

        <!-- Подвал сайта -->
        <footer class="footer">
            <p>© 2025 Контакты</p>
        </footer>
    </div>
</body>
</html>
